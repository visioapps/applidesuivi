<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mon appli de suivi</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,400;1,700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
const ICONS = {
  'credit-card': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,
  'check-square': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
  'bar-chart-2': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
  'pencil': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  'trash-2': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
};
function icon(name) { return ICONS[name] || ''; }
</script>
<style>
:root {
  --T: #5b8fd4;
  --T-light: #f0f4fb;
  --T-mid: #d4e2f4;
  --F: #d4607e;
  --F-light: #fbf0f3;
  --F-mid: #f0d0da;
  --bg: #f5f3ee;
  --surface: #ffffff;
  --surface2: #f5f3ee;
  --border: #e8e4dc;
  --border2: #d8d3c8;
  --text: #1a1814;
  --muted: #9e9890;
  --muted2: #c8c2b8;
  --r: 22px;
  --r-sm: 14px;
  --top-nav-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; background: var(--bg); overflow: hidden; }

body {
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── LOGIN ── */
.login-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 28px;
  max-width: 430px;
  width: 100%;
  margin: 0 auto;
}
.login-title {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: 36px;
  letter-spacing: -1.5px; color: var(--text);
  text-align: center; margin-bottom: 6px; line-height: 1.1;
}
.login-title em {
  font-style: italic; font-weight: 700;
  color: var(--muted); font-size: .65em;
  display: block; letter-spacing: -.5px; margin-bottom: 4px;
}
.login-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 40px; }
.login-card {
  width: 100%; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: var(--r); padding: 24px 22px;
}
.login-field { margin-bottom: 14px; }
.login-field label {
  display: block; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 6px;
}
.login-field input {
  width: 100%; padding: 13px 15px;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); font-family: 'Nunito', sans-serif;
  font-size: 15px; color: var(--text); outline: none; transition: border-color .2s; -webkit-appearance: none;
}
.login-field input:focus { border-color: var(--border2); }
.login-btn {
  width: 100%; padding: 14px; border: none; border-radius: var(--r-sm);
  background: var(--text); color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: opacity .15s;
}
.login-btn:hover { opacity: .85; }
.login-error {
  font-size: 13px; color: var(--F); text-align: center;
  margin-top: 14px; font-weight: 600; min-height: 20px;
}
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

/* ── TOP NAV ── */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--top-nav-h);
  background: rgba(245,243,238,.96);
  backdrop-filter: blur(12px);
  border-bottom: 1.5px solid var(--border);
  display: flex; align-items: stretch;
  max-width: 430px; margin: 0 auto;
  /* full width trick */
  width: 100%;
}
/* fix for centering on wide screens */
@media (min-width: 430px) {
  .top-nav { left: 50%; transform: translateX(-50%); right: auto; width: 430px; }
}

.tab-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  border: none; background: transparent;
  cursor: pointer; transition: all .18s; color: var(--muted);
  font-family: 'Nunito', sans-serif;
  border-bottom: 2.5px solid transparent;
  padding-bottom: 2px;
}
.tab-btn .icon { display: flex; align-items: center; }
.tab-btn .icon svg { width: 19px; height: 19px; pointer-events: none; }
.tab-btn .lbl { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.tab-btn.active { color: var(--text); border-bottom-color: var(--text); }

/* ── MAIN LAYOUT ── */
.main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  margin-top: var(--top-nav-h);
  overflow: hidden;
  max-width: 430px;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
  min-height: 0;
}

/* ── DATE STRIP ── */
.date-strip {
  display: flex; align-items: center;
  padding: 10px 16px 8px;
  gap: 8px;
  flex-shrink: 0;
}
.date-strip-label {
  flex: 1;
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: 20px;
  letter-spacing: -.5px; color: var(--text);
  line-height: 1.1;
}
.date-strip-label span {
  font-style: italic; font-weight: 400;
  color: var(--muted); font-size: .78em;
  margin-right: 4px;
}
.hnav-btn {
  width: 32px; height: 32px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 9px; font-size: 14px; color: var(--text);
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s;
  flex-shrink: 0;
}
.hnav-btn:hover { background: var(--border); }
.today-chip {
  padding: 0 10px; height: 32px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 9px; font-family: 'Nunito', sans-serif;
  font-size: 11px; font-weight: 700; color: var(--muted);
  cursor: pointer; display: flex; align-items: center; transition: all .15s;
  flex-shrink: 0;
}
.today-chip:hover { color: var(--text); }
.logout-btn {
  background: none; border: none; cursor: pointer;
  font-size: 10px; font-weight: 700; color: var(--muted2);
  letter-spacing: .5px; font-family: 'Nunito', sans-serif;
  flex-shrink: 0;
}

/* ── SCROLLABLE CONTENT (below form) ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px 24px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}

/* ── FORM FOOTER (at top of content, below date strip) ── */
.form-footer {
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1.5px solid var(--border);
  padding: 10px 16px 12px;
}

.form-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 14px 14px 14px;
  margin-top: 0;
}

/* ── PERSON TOGGLE ── */
.person-toggle {
  display: flex; background: var(--surface2);
  border: 1.5px solid var(--border); border-radius: var(--r);
  padding: 3px; gap: 3px; margin-bottom: 10px;
}
.person-btn {
  flex: 1; padding: 9px; border: none; border-radius: 17px;
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .22s cubic-bezier(.34,1.5,.64,1);
  background: transparent; color: var(--muted);
}
.person-btn.activeT { background: var(--T); color: #fff; box-shadow: 0 3px 12px rgba(91,143,212,.28); }
.person-btn.activeF { background: var(--F); color: #fff; box-shadow: 0 3px 12px rgba(212,96,126,.24); }

/* ── INLINE FORM ── */
.form-row { display: flex; gap: 8px; align-items: flex-start; }
.form-field { flex: 1; }
.form-field label {
  display: block; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 5px;
}
.form-field input {
  width: 100%; padding: 10px 12px;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); font-family: 'Nunito', sans-serif;
  font-size: 15px; color: var(--text); outline: none; transition: border-color .2s; -webkit-appearance: none;
}
.form-field input::placeholder { color: var(--muted2); }
.form-field input:focus { border-color: var(--border2); }

.add-btn {
  padding: 11px 16px; border: none; border-radius: var(--r-sm);
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .18s; color: #fff; white-space: nowrap; flex-shrink: 0;
}
.add-btn:active { transform: scale(.96); }
.add-btn-T { background: var(--T); box-shadow: 0 3px 14px rgba(91,143,212,.22); }
.add-btn-F { background: var(--F); box-shadow: 0 3px 14px rgba(212,96,126,.18); }

.add-btn-rec-open {
  padding: 11px 13px; border: 1.5px solid var(--border);
  border-radius: var(--r-sm); background: var(--surface2);
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.add-btn-rec-open:hover { border-color: var(--border2); color: var(--text); }

/* ── ENTRIES ── */
.entries-header {
  display: flex; justify-content: space-between; align-items: center;
  margin: 14px 0 8px;
}
.entries-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
.entries-count {
  font-size: 11px; font-weight: 700; color: var(--muted);
  background: var(--surface); border: 1.5px solid var(--border); padding: 2px 8px; border-radius: 20px;
}

.entry {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); padding: 11px 13px;
  margin-bottom: 7px; display: flex; align-items: center; gap: 10px;
  animation: popIn .18s cubic-bezier(.34,1.3,.64,1);
}
.entry:hover { border-color: var(--border2); }
.entry-rec { border-style: dashed; }
@keyframes popIn { from{opacity:0;transform:scale(.96) translateY(-4px)} to{opacity:1;transform:scale(1) translateY(0)} }

.entry-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pipT { background: var(--T); }
.pipF { background: var(--F); }

.entry-body { flex: 1; min-width: 0; }
.entry-main { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.rec-badge { display: inline-flex; align-items: center; margin-left: 4px; color: var(--muted); vertical-align: middle; }

.entry-amount { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.amtT { color: var(--T); } .amtF { color: var(--F); }

.entry-actions { display: flex; gap: 4px; }
.act-btn {
  width: 30px; height: 30px; border: 1.5px solid var(--border);
  border-radius: 9px; background: var(--surface2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--muted); transition: all .15s;
}
.act-btn svg { width: 13px; height: 13px; pointer-events: none; }
.act-btn:hover { background: var(--border); color: var(--text); }
.act-btn.del:hover { background: #fff0f0; border-color: #ffd0d0; }

.empty { text-align: center; color: var(--muted2); font-size: 14px; padding: 28px 0; font-family: 'Fraunces', serif; font-style: italic; }

/* ── RECURRING RULES LIST ── */
.rec-rule-item {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); padding: 11px 13px;
  margin-bottom: 7px; display: flex; align-items: center; gap: 10px;
}

/* ── STATS ── */
.stats-wrap { padding-top: 4px; }
.stat-view-toggle {
  display: flex; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: var(--r);
  padding: 3px; gap: 3px; margin-bottom: 14px;
}
.sv-btn {
  flex: 1; padding: 9px; border: none; border-radius: 17px;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .2s; background: transparent; color: var(--muted);
}
.sv-btn.active { background: var(--text); color: #fff; }

.stat-nav {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.stat-nav-label { font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; letter-spacing: -.5px; }

.stat-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 16px 18px; margin-bottom: 10px;
}
.stat-card-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.stat-card-label svg { width: 12px; height: 12px; pointer-events: none; }

.stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stat-name { font-size: 13px; font-weight: 600; flex: 1; }
.stat-val { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 700; }
.stat-pct { font-size: 12px; color: var(--muted); min-width: 34px; text-align: right; }
.unified-bar {
  height: 6px; border-radius: 3px; overflow: hidden; display: flex;
  background: var(--surface2); margin-top: 10px; border: 1px solid var(--border);
}
.bar-T { background: var(--T); height: 100%; transition: width .5s cubic-bezier(.34,1,.64,1); }
.bar-F { background: var(--F); height: 100%; transition: width .5s cubic-bezier(.34,1,.64,1); }

/* ── FAB ROW (bottom right) ── */
.fab-row {
  position: fixed;
  bottom: max(16px, env(safe-area-inset-bottom));
  right: 16px;
  z-index: 50;
  display: flex;
  gap: 8px;
  align-items: center;
}
.logout-fab, .fab-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  transition: all .15s;
  letter-spacing: .3px;
}
.logout-fab:hover, .fab-btn:hover { color: var(--text); border-color: var(--border2); }
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: var(--text); color: #fff;
  padding: 10px 18px; border-radius: 40px;
  font-size: 13px; font-weight: 600;
  opacity: 0; transition: all .28s cubic-bezier(.34,1.4,.64,1);
  pointer-events: none; z-index: 999; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,.14);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── OVERLAY ── */
.overlay {
  position: fixed; inset: 0; background: rgba(26,24,20,.4);
  backdrop-filter: blur(4px); z-index: 200;
  display: flex; align-items: flex-end; animation: fadeIn .18s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.overlay-sheet {
  background: var(--surface); border-top: 1.5px solid var(--border);
  border-radius: 24px 24px 0 0; padding: 10px 20px 40px;
  width: 100%; max-width: 430px; margin: 0 auto;
  animation: sheetUp .26s cubic-bezier(.34,1.2,.64,1);
  max-height: 90dvh; overflow-y: auto;
}
@keyframes sheetUp { from{transform:translateY(36px);opacity:0} to{transform:translateY(0);opacity:1} }
.sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 18px; }
.overlay-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 16px; }
.overlay-field { margin-bottom: 12px; }
.overlay-field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 6px; }
.overlay-field input {
  width: 100%; padding: 12px 14px; background: var(--surface2);
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-family: 'Nunito', sans-serif; font-size: 15px; color: var(--text); outline: none;
}
.overlay-btns { display: flex; gap: 8px; margin-top: 14px; }
.ov-cancel {
  flex: 1; padding: 13px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  background: transparent; color: var(--muted); font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
}
.ov-save {
  flex: 2; padding: 13px; border: none; border-radius: var(--r-sm);
  background: var(--text); color: #fff; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;
}
.rec-scope-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
.ov-scope-btn {
  width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface2); font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
  color: var(--text); cursor: pointer; transition: all .15s; text-align: left;
}
.ov-scope-btn:hover { background: var(--border); }
.rec-day-grid { display: flex; gap: 5px; flex-wrap: wrap; }
.rec-day-btn {
  padding: 7px 9px; border: 1.5px solid var(--border); border-radius: 9px;
  background: var(--surface2); font-family: 'Nunito', sans-serif;
  font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .15s;
}
.rec-day-btn.selected { background: var(--text); color: #fff; border-color: var(--text); }
.rec-freq-grid { display: flex; gap: 5px; flex-wrap: wrap; }
.rec-freq-btn {
  padding: 7px 9px; border: 1.5px solid var(--border); border-radius: 9px;
  background: var(--surface2); font-family: 'Nunito', sans-serif;
  font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .15s;
}
.rec-freq-btn.selected { background: var(--text); color: #fff; border-color: var(--text); }
.ov-del-rule {
  width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: var(--r-sm);
  background: none; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #c0392b; cursor: pointer;
}

.import-file-label {
  display: block; width: 100%; padding: 12px 14px;
  background: var(--surface2); border: 1.5px dashed var(--border2);
  border-radius: var(--r-sm); font-family: 'Nunito', sans-serif;
  font-size: 13px; font-weight: 700; color: var(--muted);
  cursor: pointer; text-align: center; transition: all .15s;
}
.import-file-label:hover { border-color: var(--text); color: var(--text); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap">
  <div class="login-screen">
    <div class="login-title"><em>Bienvenue</em>Mon appli<br>de suivi</div>
    <div class="login-sub">Connecte-toi pour continuer</div>
    <div class="login-card">
      <div class="login-field"><label>Prénom</label><input id="lu" type="text" placeholder="Ton prénom" autocomplete="username" autocapitalize="words"></div>
      <div class="login-field"><label>Mot de passe</label><input id="lp" type="password" placeholder="••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()"></div>
      <button class="login-btn" onclick="tryLogin()">Se connecter</button>
      <div class="login-error" id="login-err"></div>
    </div>
  </div>
</div>

<!-- TOP NAV — rempli par JS pour avoir les SVG inline -->
<nav class="top-nav" id="top-nav" style="display:none"></nav>

<!-- MAIN -->
<div class="main-wrap" id="main-wrap" style="display:none">
  <div class="date-strip" id="date-strip"></div>
  <!-- FORM FIXED JUST BELOW DATE -->
  <div class="form-footer" id="form-footer"></div>
  <!-- SCROLLABLE LIST BELOW -->
  <div class="scroll-area" id="scroll-area"></div>
</div>

<div class="toast" id="toast"></div>
<div class="fab-row" id="fab-row" style="display:none">
  <button class="fab-btn" onclick="openImportExport()">Import / Export</button>
  <button class="logout-fab" onclick="askLogout()">Déconnexion</button>
</div>

<script>
// ── AUTH ──
const USERS = { 'Fato': '0401' };
let loggedIn = sessionStorage.getItem('auth') === 'ok';

function tryLogin() {
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  if (USERS[u] && USERS[u] === p) {
    sessionStorage.setItem('auth', 'ok');
    loggedIn = true;
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('top-nav').style.display = '';
    document.getElementById('main-wrap').style.display = '';
    render();
  } else {
    const err = document.getElementById('login-err');
    err.textContent = 'Identifiant ou mot de passe incorrect';
    err.style.animation = 'none';
    requestAnimationFrame(() => { err.style.animation = 'shake .3s'; });
    document.getElementById('lp').value = '';
    document.getElementById('lp').focus();
  }
}

function logout() {
  sessionStorage.removeItem('auth');
  loggedIn = false;
  document.getElementById('login-wrap').style.display = '';
  document.getElementById('top-nav').style.display = 'none';
  document.getElementById('main-wrap').style.display = 'none';
  document.getElementById('fab-row').style.display = 'none';
  closeEdit();
  document.getElementById('lu').value = '';
  document.getElementById('lp').value = '';
  document.getElementById('login-err').textContent = '';
}

// ── STATE ──
let current = 'dep';
let currentPerson = 'F';
let selectedDate = today();
let selectedMonth = today().slice(0, 7);
let statView = 'day';
let editingId = null;
let newRecDays = [];
let newRecEvery = 1;
let depSort = 'date'; // 'date' | 'amount' | 'person'
let depDetailOpen = false;

function get() { return JSON.parse(localStorage.getItem('db')) || []; }
function save(d) { localStorage.setItem('db', JSON.stringify(d)); }
function getRules() { return JSON.parse(localStorage.getItem('recRules')) || []; }
function saveRules(r) { localStorage.setItem('recRules', JSON.stringify(r)); }
function today() { return new Date().toISOString().slice(0, 10); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function tab(t) { current = t; render(); }
function selectPerson(p) { currentPerson = p; render(); }
function setStatView(v) { statView = v; depDetailOpen = false; render(); }

// ── RECURRENCE ──
function doesRuleApplyOnDate(rule, dateStr) {
  if (dateStr < rule.startDate) return false;
  if (rule.endDate && dateStr >= rule.endDate) return false;
  const exc = rule.exceptions && rule.exceptions[dateStr];
  if (exc === 'skip') return false;
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay();
  if (!rule.days.includes(dow)) return false;
  if (rule.every > 1) {
    const start = new Date(rule.startDate + 'T12:00:00');
    const diffWeeks = Math.floor(Math.round((d - start) / 86400000) / 7);
    if (diffWeeks % rule.every !== 0) return false;
  }
  return true;
}

function getRecurringEntriesForDate(dateStr) {
  return getRules()
    .filter(r => doesRuleApplyOnDate(r, dateStr))
    .map(r => {
      const override = r.editOverrides && r.editOverrides[dateStr];
      return { id: 'rec_' + r.id + '_' + dateStr, ruleId: r.id, type: 'tac', p: r.p, v: override ? override.label : r.label, date: dateStr, isRecurring: true };
    });
}

function freqLabel(rule) {
  const DN = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  return rule.days.map(d => DN[d]).join(', ') + ' · ' + (rule.every === 1 ? 'chaque sem.' : `1/${rule.every} sem.`);
}

// ── ADD ──
function add(type) {
  const v = document.getElementById('v')?.value?.trim();
  const m = document.getElementById('m')?.value?.trim() || '';
  if (!v) { showToast('⚠ Remplis le champ'); return; }
  const d = get();
  d.push({ id: Date.now(), type, p: currentPerson, v: type === 'dep' ? parseFloat(v) : v, m, date: selectedDate });
  save(d);
  document.getElementById('v').value = '';
  if (document.getElementById('m')) document.getElementById('m').value = '';
  showToast(type === 'dep' ? 'Dépense ajoutée' : 'Tâche ajoutée');
  renderScrollArea();
}

// ── OVERLAY ──
function closeEdit() {
  editingId = null;
  const ov = document.getElementById('edit-overlay');
  if (ov) ov.remove();
}

function openEdit(id) { editingId = id; showOverlay('edit'); }
function del(id) { showOverlay('del', id); }
function openEditRec(ruleId, dateStr) { editingId = { ruleId, dateStr }; showOverlay('editRec'); }
function delRec(ruleId, dateStr) { editingId = { ruleId, dateStr }; showOverlay('delRec'); }
function openAddRec() { newRecDays = []; newRecEvery = 1; showOverlay('addRec'); }
function openEditRecRule(ruleId) { editingId = { ruleId, dateStr: null }; showOverlay('editRecRule'); }

function saveEdit() {
  const d = get();
  const item = d.find(x => x.id === editingId);
  const v = document.getElementById('ev')?.value?.trim();
  const m = document.getElementById('em')?.value?.trim() || '';
  if (!v) return;
  if (item.type === 'dep') { item.v = parseFloat(v); item.m = m; } else { item.v = v; }
  save(d); closeEdit(); showToast('Modifié ✓'); renderScrollArea();
}

function confirmDel(id) {
  save(get().filter(x => x.id !== id));
  closeEdit(); showToast('Supprimé'); renderScrollArea();
}

function applyRecEdit(scope) {
  const { ruleId, dateStr } = editingId;
  const rules = getRules();
  const rule = rules.find(r => r.id === ruleId);
  const newLabel = document.getElementById('ev')?.value?.trim();
  if (!newLabel) return;
  if (scope === 'one') {
    if (!rule.editOverrides) rule.editOverrides = {};
    rule.editOverrides[dateStr] = { label: newLabel };
  } else if (scope === 'future') {
    rule.endDate = dateStr;
    rules.push({ ...JSON.parse(JSON.stringify(rule)), id: Date.now(), label: newLabel, startDate: dateStr, endDate: undefined, exceptions: {}, editOverrides: {} });
  } else {
    rule.label = newLabel; rule.editOverrides = {};
  }
  saveRules(rules); closeEdit(); showToast('Modifié ✓'); renderScrollArea();
}

function applyRecDel(scope) {
  const { ruleId, dateStr } = editingId;
  const rules = getRules();
  const idx = rules.findIndex(r => r.id === ruleId);
  const rule = rules[idx];
  if (scope === 'one') { if (!rule.exceptions) rule.exceptions = {}; rule.exceptions[dateStr] = 'skip'; saveRules(rules); }
  else if (scope === 'future') { rule.endDate = dateStr; saveRules(rules); }
  else { rules.splice(idx, 1); saveRules(rules); }
  closeEdit(); showToast('Supprimé'); renderScrollArea();
}

function toggleRecDay(d) {
  newRecDays = newRecDays.includes(d) ? newRecDays.filter(x => x !== d) : [...newRecDays, d];
  document.querySelectorAll('.rec-day-btn').forEach(btn => btn.classList.toggle('selected', newRecDays.includes(parseInt(btn.dataset.day))));
}
function setRecEvery(n) {
  newRecEvery = n;
  document.querySelectorAll('.rec-freq-btn').forEach(btn => btn.classList.toggle('selected', parseInt(btn.dataset.every) === n));
}

function saveNewRec() {
  const label = document.getElementById('rec-label')?.value?.trim();
  const startDate = document.getElementById('rec-start')?.value || today();
  if (!label) { showToast('⚠ Nomme la tâche'); return; }
  if (newRecDays.length === 0) { showToast('⚠ Choisis au moins un jour'); return; }
  const rules = getRules();
  rules.push({ id: Date.now(), label, p: currentPerson, days: [...newRecDays], every: newRecEvery, startDate, exceptions: {}, editOverrides: {} });
  saveRules(rules); newRecDays = []; newRecEvery = 1; closeEdit(); showToast('Récurrence créée ✓'); renderScrollArea();
}

function saveEditRecRule() {
  const { ruleId } = editingId;
  const rules = getRules();
  const rule = rules.find(r => r.id === ruleId);
  const label = document.getElementById('rec-label')?.value?.trim();
  const startDate = document.getElementById('rec-start')?.value;
  if (label) rule.label = label;
  if (startDate) rule.startDate = startDate;
  rule.days = [...newRecDays]; rule.every = newRecEvery;
  saveRules(rules); closeEdit(); showToast('Récurrence modifiée ✓'); renderScrollArea();
}

function delRecRule(ruleId) {
  saveRules(getRules().filter(r => r.id !== ruleId));
  closeEdit(); showToast('Récurrence supprimée'); renderScrollArea();
}

function showOverlay(mode, extraId) {
  const existing = document.getElementById('edit-overlay');
  if (existing) existing.remove();
  const db = get(); const rules = getRules();
  const DAY_NAMES = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const DAY_ORDER = [1,2,3,4,5,6,0];
  let inner = '';

  if (mode === 'edit') {
    const item = db.find(x => x.id === editingId);
    inner = `<div class="overlay-title">Modifier</div>
    ${item.type === 'dep'
      ? `<div class="overlay-field"><label>Montant (€)</label><input id="ev" type="number" value="${item.v}" step="0.01"></div>
         <div class="overlay-field"><label>Motif</label><input id="em" value="${item.m}"></div>`
      : `<div class="overlay-field"><label>Tâche</label><input id="ev" value="${item.v}"></div>`}
    <div class="overlay-btns">
      <button class="ov-cancel" onclick="closeEdit()">Annuler</button>
      <button class="ov-save" onclick="saveEdit()">Enregistrer</button>
    </div>`;

  } else if (mode === 'del') {
    inner = `<div class="overlay-title">Supprimer ?</div>
    <p style="font-size:14px;color:var(--muted);margin-bottom:18px">Cette entrée sera supprimée définitivement.</p>
    <div class="overlay-btns">
      <button class="ov-cancel" onclick="closeEdit()">Annuler</button>
      <button class="ov-save" style="background:#c0392b" onclick="confirmDel(${extraId})">Supprimer</button>
    </div>`;

  } else if (mode === 'editRec') {
    const { ruleId, dateStr } = editingId;
    const rule = rules.find(r => r.id === ruleId);
    const cur = (rule.editOverrides && rule.editOverrides[dateStr]) ? rule.editOverrides[dateStr].label : rule.label;
    inner = `<div class="overlay-title">Modifier la tâche</div>
    <div class="overlay-field"><label>Tâche</label><input id="ev" value="${cur}"></div>
    <div class="rec-scope-label" style="margin-top:12px">Modifier…</div>
    <div style="display:flex;flex-direction:column;gap:7px">
      <button class="ov-scope-btn" onclick="applyRecEdit('one')">Ce jour uniquement</button>
      <button class="ov-scope-btn" onclick="applyRecEdit('future')">Ce jour et les suivants</button>
      <button class="ov-scope-btn" onclick="applyRecEdit('all')">Toutes les occurrences</button>
      <button class="ov-cancel" onclick="closeEdit()">Annuler</button>
    </div>`;

  } else if (mode === 'delRec') {
    inner = `<div class="overlay-title">Supprimer ?</div>
    <div class="rec-scope-label">Supprimer…</div>
    <div style="display:flex;flex-direction:column;gap:7px">
      <button class="ov-scope-btn" style="background:#fff0f0;border-color:#ffd0d0;color:#c0392b" onclick="applyRecDel('one')">Ce jour uniquement</button>
      <button class="ov-scope-btn" style="background:#fff0f0;border-color:#ffd0d0;color:#c0392b" onclick="applyRecDel('future')">Ce jour et les suivants</button>
      <button class="ov-scope-btn" style="background:#fff0f0;border-color:#ffd0d0;color:#c0392b" onclick="applyRecDel('all')">Toutes les occurrences</button>
      <button class="ov-cancel" onclick="closeEdit()">Annuler</button>
    </div>`;

  } else if (mode === 'addRec' || mode === 'editRecRule') {
    const isEdit = mode === 'editRecRule';
    let rule = null;
    if (isEdit) { rule = rules.find(r => r.id === editingId.ruleId); newRecDays = [...rule.days]; newRecEvery = rule.every; }
    const dayBtns = DAY_ORDER.map(d => `<button class="rec-day-btn ${newRecDays.includes(d)?'selected':''}" data-day="${d}" onclick="toggleRecDay(${d})">${DAY_NAMES[d]}</button>`).join('');
    const freqBtns = [1,2,3,4].map(n => `<button class="rec-freq-btn ${newRecEvery===n?'selected':''}" data-every="${n}" onclick="setRecEvery(${n})">${n===1?'Chaque sem.':`1/${n} sem.`}</button>`).join('');
    inner = `<div class="overlay-title">${isEdit ? 'Modifier la récurrence' : 'Nouvelle récurrence'}</div>
    <div class="overlay-field"><label>Nom</label><input id="rec-label" value="${isEdit?rule.label:''}" placeholder="Sport, ménage…"></div>
    <div class="overlay-field"><label>Jours</label><div class="rec-day-grid">${dayBtns}</div></div>
    <div class="overlay-field"><label>Fréquence</label><div class="rec-freq-grid">${freqBtns}</div></div>
    <div class="overlay-field"><label>À partir du</label><input id="rec-start" type="date" value="${isEdit?rule.startDate:selectedDate}"></div>
    <div class="overlay-btns">
      <button class="ov-cancel" onclick="closeEdit()">Annuler</button>
      <button class="ov-save" onclick="${isEdit?'saveEditRecRule()':'saveNewRec()'}">${isEdit?'Enregistrer':'Créer'}</button>
    </div>
    ${isEdit ? `<button class="ov-del-rule" onclick="delRecRule(${rule.id})">Supprimer cette récurrence</button>` : ''}`;
  }

  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'edit-overlay';
  ov.innerHTML = `<div class="overlay-sheet"><div class="sheet-handle"></div>${inner}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeEdit(); });
  document.body.appendChild(ov);
  setTimeout(() => (document.getElementById('ev') || document.getElementById('rec-label'))?.focus(), 80);
}

// ── DATE FORMAT ──
function parseLocal(s) { return new Date(s + 'T12:00:00'); }
function heroDate(s) {
  const d = parseLocal(s);
  const cap = str => str.charAt(0).toUpperCase() + str.slice(1);
  return { day: cap(d.toLocaleDateString('fr-FR', { weekday: 'long' })), num: d.getDate(), month: cap(d.toLocaleDateString('fr-FR', { month: 'long' })), year: d.getFullYear() };
}
function heroMonth(s) {
  const d = new Date(s + '-01T12:00:00');
  const m = d.toLocaleDateString('fr-FR', { month: 'long' });
  return `${m.charAt(0).toUpperCase()+m.slice(1)} ${d.getFullYear()}`;
}
function fullDayLabel(s) { const { day, num, month } = heroDate(s); return `${day} ${num} ${month}`; }
function isToday(s) { return s === today(); }

function changeDay(offset) {
  const d = new Date(selectedDate); d.setDate(d.getDate() + offset);
  selectedDate = d.toISOString().slice(0, 10); render();
}
function changeMonth(offset) {
  const d = new Date(selectedMonth + '-01'); d.setMonth(d.getMonth() + offset);
  selectedMonth = d.toISOString().slice(0, 7); render();
}
function goToday() { selectedDate = today(); render(); }

// ── HTML HELPERS ──
function entryHTML(item) {
  const isT = item.p === 'T';
  const isRec = item.isRecurring;
  const recIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:10px;height:10px;pointer-events:none"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
  const editFn = isRec ? `openEditRec(${item.ruleId},'${item.date}')` : `openEdit(${item.id})`;
  const delFn  = isRec ? `delRec(${item.ruleId},'${item.date}')` : `del(${item.id})`;
  return `<div class="entry ${isRec?'entry-rec':''}">
    <div class="entry-pip ${isT?'pipT':'pipF'}"></div>
    <div class="entry-body">
      <div class="entry-main">${item.type==='dep'?(item.m||'Sans motif'):item.v}${isRec?`<span class="rec-badge">${recIcon}</span>`:''}</div>
      <div class="entry-sub">${isT?'T':'F'}${isRec?' · récurrent':''}</div>
    </div>
    ${item.type==='dep'?`<div class="entry-amount ${isT?'amtT':'amtF'}">${item.v.toFixed(2)} €</div>`:''}
    <div class="entry-actions">
      <button class="act-btn" onclick="${editFn}">${icon('pencil')}</button>
      <button class="act-btn del" onclick="${delFn}">${icon('trash-2')}</button>
    </div>
  </div>`;
}

function setDepSort(s) { depSort = s; renderScrollArea(); }
function toggleDepDetail() { depDetailOpen = !depDetailOpen; renderScrollArea(); }

function statCardHTML(data, type, isMonthView) {
  let T = 0, F = 0;
  const depItems = data.filter(x => x.type === type);
  depItems.forEach(x => { x.p==='T' ? (type==='dep'?T+=x.v:T++) : (type==='dep'?F+=x.v:F++); });
  const total = T + F || 1;
  const pT = Math.round(T / total * 100), pF = 100 - pT;
  const fmt = v => type === 'dep' ? `${v.toFixed(2)} €` : `${v}`;
  const ic = type === 'dep' ? icon('credit-card') : icon('check-square');

  // Clickable header only for dep in month view
  const isClickable = type === 'dep' && isMonthView;
  const chevron = depDetailOpen
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;pointer-events:none"><polyline points="18 15 12 9 6 15"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;pointer-events:none"><polyline points="6 9 12 15 18 9"/></svg>`;

  let detailHTML = '';
  if (isClickable && depDetailOpen) {
    // Sort
    let sorted = [...depItems];
    if (depSort === 'date')   sorted.sort((a,b) => a.date.localeCompare(b.date));
    if (depSort === 'amount') sorted.sort((a,b) => b.v - a.v);
    if (depSort === 'person') sorted.sort((a,b) => a.p.localeCompare(b.p));

    const sortBtns = [
      { k:'date',   l:'Date' },
      { k:'amount', l:'Montant' },
      { k:'person', l:'T / F' },
    ].map(s => `<button onclick="setDepSort('${s.k}')" style="
      padding:5px 10px;border-radius:8px;border:1.5px solid var(--border);
      background:${depSort===s.k?'var(--text)':'var(--surface2)'};
      color:${depSort===s.k?'#fff':'var(--muted)'};
      font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;cursor:pointer;">${s.l}</button>`).join('');

    const rows = sorted.map(x => {
      const isT = x.p === 'T';
      return `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--${isT?'T':'F'});flex-shrink:0"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.m||'Sans motif'}</div>
          <div style="font-size:11px;color:var(--muted)">${x.date} · ${isT?'T':'F'}</div>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:14px;font-weight:700;color:var(--${isT?'T':'F'});flex-shrink:0">${x.v.toFixed(2)} €</div>
      </div>`;
    }).join('');

    detailHTML = `
      <div style="border-top:1.5px solid var(--border);margin-top:14px;padding-top:12px">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${sortBtns}</div>
        ${sorted.length === 0 ? `<div style="text-align:center;color:var(--muted2);padding:16px 0;font-style:italic;font-family:'Fraunces',serif">Aucune dépense</div>` : rows}
        <div style="font-size:11px;color:var(--muted);text-align:right;padding-top:8px">${sorted.length} entrée(s)</div>
      </div>`;
  }

  return `<div class="stat-card" style="${isClickable?'cursor:pointer;':''}" ${isClickable?'onclick="toggleDepDetail()"':''}>
    <div class="stat-card-label" style="justify-content:space-between">
      <span style="display:flex;align-items:center;gap:6px">${ic} ${type==='dep'?'Dépenses':'Tâches'}</span>
      ${isClickable ? `<span style="color:var(--muted)">${chevron}</span>` : ''}
    </div>
    <div class="stat-row"><div class="stat-dot" style="background:var(--T)"></div><div class="stat-name" style="color:var(--T)">T</div><div class="stat-val" style="color:var(--T)">${fmt(T)}</div><div class="stat-pct">${pT}%</div></div>
    <div class="stat-row"><div class="stat-dot" style="background:var(--F)"></div><div class="stat-name" style="color:var(--F)">F</div><div class="stat-val" style="color:var(--F)">${fmt(F)}</div><div class="stat-pct">${pF}%</div></div>
    <div class="unified-bar"><div class="bar-T" style="width:${pT}%"></div><div class="bar-F" style="width:${pF}%"></div></div>
    ${detailHTML}
  </div>`;
}

// ── RENDER ──
function renderDateStrip() {
  const strip = document.getElementById('date-strip');
  if (current === 'stats') { strip.style.display = 'none'; return; }
  strip.style.display = '';
  const { day, num, month } = heroDate(selectedDate);
  document.getElementById('date-strip').innerHTML = `
    <button class="hnav-btn" onclick="changeDay(-1)">←</button>
    <div class="date-strip-label"><span>${day}</span>${num} ${month}</div>
    <button class="hnav-btn" onclick="changeDay(1)">→</button>
    ${!isToday(selectedDate) ? `<button class="today-chip" onclick="goToday()">Auj.</button>` : ''}`;
}

function renderFormFooter() {
  const ff = document.getElementById('form-footer');
  if (current === 'stats') { ff.style.display = 'none'; return; }
  ff.style.display = '';
  if (current === 'dep') {
    ff.innerHTML = `
      <div class="person-toggle">
        <button class="person-btn ${currentPerson==='T'?'activeT':''}" onclick="selectPerson('T')">T</button>
        <button class="person-btn ${currentPerson==='F'?'activeF':''}" onclick="selectPerson('F')">F</button>
      </div>
      <div class="form-card">
        <div class="form-row">
          <div class="form-field"><label>Montant (€)</label><input id="v" type="number" placeholder="0.00" step="0.01" min="0" inputmode="decimal"></div>
          <div class="form-field"><label>Motif</label><input id="m" placeholder="Courses, restaurant…"></div>
        </div>
        <button class="add-btn add-btn-${currentPerson}" style="width:100%;margin-top:10px" onclick="add('dep')">+ Ajouter une dépense</button>
      </div>`;
  } else {
    ff.innerHTML = `
      <div class="person-toggle">
        <button class="person-btn ${currentPerson==='T'?'activeT':''}" onclick="selectPerson('T')">T</button>
        <button class="person-btn ${currentPerson==='F'?'activeF':''}" onclick="selectPerson('F')">F</button>
      </div>
      <div class="form-card">
        <div class="form-field" style="margin-bottom:10px"><label>Tâche</label><input id="v" placeholder="Cuisine, lessive…"></div>
        <div style="display:flex;gap:8px">
          <button class="add-btn add-btn-${currentPerson}" style="flex:1" onclick="add('tac')">+ Ponctuelle</button>
          <button class="add-btn-rec-open" onclick="openAddRec()">↻ Récurrente</button>
        </div>
      </div>`;
  }
}

function renderScrollArea() {
  const db = get(); const rules = getRules();
  const sa = document.getElementById('scroll-area');
  let html = '';

  if (current === 'dep') {
    const entries = db.filter(x => x.date === selectedDate && x.type === 'dep').sort((a,b) => b.id - a.id);
    html += `<div class="entries-header"><div class="entries-title">Ce jour</div><div class="entries-count">${entries.length}</div></div>`;
    html += entries.length === 0 ? `<div class="empty">Rien pour ce jour</div>` : entries.map(entryHTML).join('');
  }

  if (current === 'tac') {
    const manual = db.filter(x => x.date === selectedDate && x.type === 'tac').sort((a,b) => b.id - a.id);
    const recurring = getRecurringEntriesForDate(selectedDate);
    const all = [...recurring, ...manual];
    html += `<div class="entries-header"><div class="entries-title">Ce jour</div><div class="entries-count">${all.length}</div></div>`;
    html += all.length === 0 ? `<div class="empty">Rien pour ce jour</div>` : all.map(entryHTML).join('');
    if (rules.length > 0) {
      html += `<div class="entries-header" style="margin-top:18px"><div class="entries-title">Récurrences actives</div><div class="entries-count">${rules.length}</div></div>`;
      rules.forEach(rule => {
        const isT = rule.p === 'T';
        html += `<div class="rec-rule-item">
          <div class="entry-pip ${isT?'pipT':'pipF'}"></div>
          <div class="entry-body"><div class="entry-main">${rule.label}</div><div class="entry-sub">${freqLabel(rule)}</div></div>
          <button class="act-btn" onclick="openEditRecRule(${rule.id})">${icon('pencil')}</button>
        </div>`;
      });
    }
  }

  if (current === 'stats') {
    const isDay = statView === 'day';
    const manualData = isDay ? db.filter(x => x.date === selectedDate) : db.filter(x => x.date.startsWith(selectedMonth));
    let recData = [];
    if (isDay) { recData = getRecurringEntriesForDate(selectedDate); }
    else {
      const [y, m2] = selectedMonth.split('-').map(Number);
      const dim = new Date(y, m2, 0).getDate();
      for (let d = 1; d <= dim; d++) recData.push(...getRecurringEntriesForDate(`${selectedMonth}-${String(d).padStart(2,'0')}`));
    }
    const allData = [...manualData, ...recData];
    html += `<div class="stats-wrap">
      <div class="stat-view-toggle">
        <button class="sv-btn ${isDay?'active':''}" onclick="setStatView('day')">Jour</button>
        <button class="sv-btn ${!isDay?'active':''}" onclick="setStatView('month')">Mois</button>
      </div>
      <div class="stat-nav">
        <button class="hnav-btn" onclick="${isDay?'changeDay(-1)':'changeMonth(-1)'}">←</button>
        <div class="stat-nav-label">${isDay?fullDayLabel(selectedDate):heroMonth(selectedMonth)}</div>
        <button class="hnav-btn" onclick="${isDay?'changeDay(1)':'changeMonth(1)'}">→</button>
      </div>
      ${statCardHTML(allData,'dep', !isDay)}
      ${statCardHTML(allData,'tac', !isDay)}
    </div>`;
  }

  sa.innerHTML = html;
}

function askLogout() {
  const existing = document.getElementById('edit-overlay');
  if (existing) existing.remove();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'edit-overlay';
  ov.innerHTML = `<div class="overlay-sheet">
    <div class="sheet-handle"></div>
    <div class="overlay-title">Se déconnecter ?</div>
    <p style="font-size:14px;color:var(--muted);margin-bottom:18px">Tu devras te reconnecter la prochaine fois.</p>
    <div class="overlay-btns">
      <button class="ov-cancel" onclick="closeEdit()">Annuler</button>
      <button class="ov-save" onclick="logout()">Déconnexion</button>
    </div>
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeEdit(); });
  document.body.appendChild(ov);
}

// ── IMPORT / EXPORT ──
function openImportExport() {
  const existing = document.getElementById('edit-overlay');
  if (existing) existing.remove();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'edit-overlay';
  ov.innerHTML = `<div class="overlay-sheet">
    <div class="sheet-handle"></div>
    <div class="overlay-title">Import / Export</div>

    <div style="margin-bottom:20px">
      <div class="rec-scope-label" style="margin-bottom:6px">📤 Exporter mes données</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Télécharge un fichier JSON avec toutes tes dépenses, tâches et récurrences.</p>
      <button class="ov-save" style="width:100%" onclick="doExport()">Télécharger le fichier de sauvegarde</button>
    </div>

    <div style="border-top:1.5px solid var(--border);padding-top:20px;margin-bottom:8px">
      <div class="rec-scope-label" style="margin-bottom:6px">📥 Importer des données</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Seules les entrées absentes seront ajoutées — tes données actuelles ne seront pas écrasées.</p>
      <label class="import-file-label">
        Choisir un fichier JSON
        <input type="file" accept=".json" onchange="doImport(this)" style="display:none">
      </label>
      <div id="import-result" style="font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;text-align:center"></div>
    </div>

    <button class="ov-cancel" style="width:100%;margin-top:8px" onclick="closeEdit()">Fermer</button>
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeEdit(); });
  document.body.appendChild(ov);
}

function doExport() {
  const data = { db: get(), recRules: getRules(), exportedAt: new Date().toISOString() };
  const json = JSON.stringify(data, null, 2);
  downloadJSON(json);
  showToast('Fichier téléchargé ✓');
  closeEdit();
}

function downloadJSON(json) {
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'suivi_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function doImport(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported   = JSON.parse(e.target.result);
      const newDb      = imported.db       || [];
      const newRules   = imported.recRules || [];
      const existingDb    = get();
      const existingRules = getRules();
      const existingIds   = new Set(existingDb.map(x => x.id));
      const existingRIds  = new Set(existingRules.map(x => x.id));
      const addedDb    = newDb.filter(x => !existingIds.has(x.id));
      const addedRules = newRules.filter(x => !existingRIds.has(x.id));
      save([...existingDb, ...addedDb]);
      saveRules([...existingRules, ...addedRules]);
      const msg = `✓ ${addedDb.length} entrée(s) et ${addedRules.length} règle(s) importée(s).`;
      document.getElementById('import-result').textContent = msg;
      showToast('Import réussi ✓');
      renderScrollArea();
    } catch {
      document.getElementById('import-result').textContent = '⚠ Fichier invalide.';
    }
  };
  reader.readAsText(file);
}

function renderNav() {
  document.getElementById('top-nav').innerHTML = `
    <button class="tab-btn ${current==='dep'?'active':''}" id="nt-dep" onclick="tab('dep')">
      <span class="icon">${icon('credit-card')}</span><span class="lbl">Dépenses</span>
    </button>
    <button class="tab-btn ${current==='tac'?'active':''}" id="nt-tac" onclick="tab('tac')">
      <span class="icon">${icon('check-square')}</span><span class="lbl">Tâches</span>
    </button>
    <button class="tab-btn ${current==='stats'?'active':''}" id="nt-stats" onclick="tab('stats')">
      <span class="icon">${icon('bar-chart-2')}</span><span class="lbl">Stats</span>
    </button>`;
}

function render() {
  renderNav();
  renderDateStrip();
  renderFormFooter();
  renderScrollArea();
}

// ── INIT ──
if (loggedIn) {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('top-nav').style.display = '';
  document.getElementById('main-wrap').style.display = '';
  document.getElementById('fab-row').style.display = '';
  render();
} else {
  document.getElementById('login-wrap').style.display = '';
  document.getElementById('fab-row').style.display = 'none';
  setTimeout(() => document.getElementById('lu')?.focus(), 100);
}
</script>
